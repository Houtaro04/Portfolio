<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quản trị nội dung (Sveltia, bản thử)</title>
</head>
<body>
  <!-- Bản thử với Sveltia CMS: chọn/tải NHIỀU ảnh một lúc. Trang /admin/ (Decap) vẫn chạy song song. -->
  <script>
    // Tìm config.yml nằm cạnh trang này, dù gõ /admin/sveltia hay /admin/sveltia/
    (function () {
      var dir = location.pathname.replace(/\/(index(\.html)?)?$/, '');
      var link = document.createElement('link');
      link.rel = 'cms-config-url';
      link.type = 'text/yaml';
      link.href = dir + '/config.yml';
      document.head.appendChild(link);
    })();
  </script>
  <!-- Cố định phiên bản: trang admin giữ quyền ghi vào repo nên không nạp bản "mới nhất" tự đổi. Không thêm type="module". -->
  <script src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js"></script>
</body>
</html>
